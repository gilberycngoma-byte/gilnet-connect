<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { width: 64px; height: 180px; margin: 0; overflow: hidden; background: transparent; user-select: none; }
      #bubbles { display: flex; flex-direction: column; gap: 8px; width: 64px; padding: 2px; box-sizing: border-box; }
      button { position: relative; width: 52px; height: 52px; border: 0; border-radius: 50%; color: white; background: #6d28d9; box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer; font-size: 20px; }
      button:hover { transform: scale(1.05); }
      button.hidden { display: none; }
      .badge { display: none; position: absolute; right: -3px; top: -3px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #dc2626; font-size: 11px; line-height: 20px; font-weight: 700; box-sizing: border-box; }
      .badge.show { display: block; }
    </style>
  </head>
  <body>
    <nav id="bubbles" aria-label="GILNET quick access">
      <button id="attendance" title="Staff attendance" aria-label="Staff attendance">A<span class="badge" id="attendance-badge"></span></button>
      <button id="messages" title="Messages" aria-label="Messages">M<span class="badge" id="messages-badge"></span></button>
      <button id="notices" title="Notices" aria-label="Notices">N<span class="badge" id="notices-badge"></span></button>
    </nav>
    <script>
      for (const [id, route] of [["attendance","/attendance"],["messages","/messages"],["notices","/notices"]]) {
        document.getElementById(id).addEventListener("click", () => window.gilnetBubbles.openRoute(route));
      }
      window.gilnetBubbles.onState((state) => {
        if (!state) return;
        for (const id of ["attendance","messages","notices"]) {
          document.getElementById(id).classList.toggle("hidden", state[id] === false);
        }
        for (const id of ["messages","notices"]) {
          const count = Number(state[`${id}Unread`] || 0);
          const badge = document.getElementById(`${id}-badge`);
          badge.textContent = count > 99 ? "99+" : String(count);
          badge.classList.toggle("show", count > 0);
        }
      });
    </script>
  </body>
</html>
